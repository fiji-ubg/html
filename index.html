<style>
:root{--accent:#2596be;--on-accent:#fff;--r:10px;--fs:14px;
--coral:#db5844;--teal:#57abb0;--deep:#135751;--navy:#134f5b;--cream:#f6f1e6;--green:#135851}
[data-mode=light]{--frame:color-mix(in srgb,var(--accent) 14%,#dde1e6);--tool:#fff;--surf:#f6f8fa;--surf2:#eceff3;--text:#1f2328;--mut:#5f6b76;--line:#d7dce1;--hover:rgba(0,0,0,.07);--shadow:0 6px 24px rgba(0,0,0,.18)}
[data-mode=dark]{--frame:color-mix(in srgb,var(--accent) 12%,#101316);--tool:#1d2227;--surf:#161a1e;--surf2:#22282e;--text:#e8edf1;--mut:#93a0ab;--line:#2d353d;--hover:rgba(255,255,255,.09);--shadow:0 6px 24px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--text);font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text)}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
#app{display:flex;flex-direction:column;height:100%}
#tabstrip{display:flex;align-items:flex-end;padding:8px 8px 0;gap:2px;min-height:42px}
#tabs{display:flex;gap:2px;min-width:0;flex:0 1 auto;overflow:hidden}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;min-width:44px;max-width:240px;flex:1 1 220px;border-radius:calc(var(--r) + 2px) calc(var(--r) + 2px) 0 0;cursor:default;user-select:none;color:var(--mut)}
[data-tabshape=flat] .tab{border-radius:4px 4px 0 0}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--tool);color:var(--text)}
.tab.pinned{flex:0 0 42px;max-width:42px;padding:0 0 0 12px}.tab.pinned .tt,.tab.pinned .tx{display:none}
.tab .fi{width:16px;height:16px;flex:none;display:grid;place-items:center}.tab .fi img{width:16px;height:16px;border-radius:3px}
.tab .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tab .tx{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;opacity:.7}.tab .tx:hover{background:var(--hover);opacity:1}
.tab.drag{opacity:.4}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;color:var(--mut)}
.ib:hover{background:var(--hover);color:var(--text)}.ib:disabled{opacity:.35;pointer-events:none}
.ib .badge{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#newtab{margin:0 0 4px 4px}
#toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--line)}
#omni{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;background:var(--surf2);border-radius:17px;border:2px solid transparent;min-width:0}
#omni:focus-within{border-color:var(--accent);background:var(--tool)}
#omni input{flex:1;border:0;outline:0;background:none;min-width:0}
#omni .lock{color:var(--mut);display:grid}
#bmbar{display:flex;align-items:center;gap:2px;padding:3px 8px;background:var(--tool);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
[data-bmbar=off] #bmbar{display:none}
.bm{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:14px;font-size:12.5px;position:relative}
.bm:hover{background:var(--hover)}.bm .badge{background:var(--coral);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-weight:700}
.bm.sep{width:1px;height:16px;background:var(--line);padding:0;margin:0 4px;border-radius:0}
#main{flex:1;display:flex;min-height:0;background:var(--tool)}
#views{flex:1;position:relative;min-width:0}
.view{position:absolute;inset:0;display:none;background:var(--surf);overflow:auto}.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.view.fr{overflow:hidden}
.bub{max-width:92%;padding:9px 12px;border-radius:14px;word-wrap:break-word;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--surf2);border-bottom-left-radius:4px}
.bub code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;font-size:.92em}
.bub pre{background:#0d1114;color:#e6edf3;padding:10px;border-radius:8px;overflow:auto;white-space:pre;margin:6px 0}
.bub a{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.chip{padding:5px 11px;border-radius:14px;background:var(--surf2);font-size:12px;border:1px solid var(--line)}.chip:hover{border-color:var(--accent)}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}
.btn{padding:8px 16px;border-radius:calc(var(--r) + 8px);background:var(--accent);color:var(--on-accent);font-weight:600}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:var(--surf2);color:var(--text)}.btn.red{background:#d64545;color:#fff}.btn.sm{padding:5px 11px;font-size:12px}.btn:disabled{opacity:.5;pointer-events:none}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.inp{width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surf);outline:0}.inp:focus{border-color:var(--accent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
#menu,.pop{position:fixed;z-index:60;background:var(--tool);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}.mi:hover{background:var(--hover)}.mi .k{margin-left:auto;color:var(--mut);font-size:11px}

.av .sd{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;border:2px solid var(--tool)}
.st-online{background:#3ba55d}.st-dnd{background:#ed4245}.st-idle{background:#faa61a}.st-offline,.st-invisible{background:#747f8d}

.nt{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),radial-gradient(circle at 85% 90%,color-mix(in srgb,var(--coral) 16%,transparent),transparent 50%),var(--surf)}
.nt h1{font-size:54px;margin:0;letter-spacing:-.03em;display:flex;align-items:center;gap:14px}
.nt .sb{width:min(620px,100%);display:flex;gap:10px;align-items:center;background:var(--tool);border:1px solid var(--line);border-radius:28px;padding:0 20px;height:52px;box-shadow:var(--shadow)}
.nt .sb input{flex:1;border:0;background:none;outline:0;font-size:16px}
.tiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:640px}

/* settings / admin */
.pg{display:flex;min-height:100%}
.pgnav{width:220px;padding:20px 12px;border-right:1px solid var(--line);background:var(--tool);flex:none}
.pgnav h3{margin:0 8px 14px;display:flex;align-items:center;gap:8px}
.pgnav button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:20px;text-align:left;color:var(--mut)}
.pgnav button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:600}.pgnav button:hover:not(.on){background:var(--hover)}
.pgbody{flex:1;padding:28px 36px;max-width:860px}
.pgbody h2{margin:0 0 16px}
.card{background:var(--tool);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .grow{flex:1}.row small{color:var(--mut);display:block}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);flex:none;transition:.15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.sws{display:flex;gap:8px;flex-wrap:wrap}.swc{width:30px;height:30px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}.swc.on{border-color:var(--tool);outline:2px solid var(--text)}
.pcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--tool);max-width:420px}
.pcard .bn{height:120px;background:linear-gradient(135deg,var(--accent),var(--navy));background-size:cover;background-position:center}
.pcard .pb{padding:0 18px 18px;margin-top:-38px}.pcard .nm{font-size:19px;font-weight:700;margin-top:8px}
.seg{display:inline-flex;background:var(--surf2);border-radius:20px;padding:3px}.seg button{padding:5px 14px;border-radius:17px;color:var(--mut)}.seg button.on{background:var(--tool);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;background:var(--surf2)}
.pill i{width:8px;height:8px;border-radius:50%}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.perm{display:flex;gap:10px;align-items:flex-start;padding:7px 0}.perm input{margin-top:4px}
/* chat */
.chat{display:flex;height:100%;background:var(--tool)}
.cside{width:250px;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.cside h4{margin:14px 14px 6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}

.cmain{flex:1;display:flex;flex-direction:column;min-width:0}

.mention.me{background:color-mix(in srgb,var(--coral) 28%,transparent);color:var(--coral)}
.ccomp{padding:0 18px 18px;position:relative}
.ccomp textarea{width:100%;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:12px 14px;outline:0;max-height:160px}
.ccomp textarea:focus{border-color:var(--accent)}
.sugg{position:absolute;bottom:68px;left:18px;right:18px;background:var(--tool);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 12px;text-align:left}.sugg button.on,.sugg button:hover{background:var(--hover)}
.cmem{width:220px;background:var(--surf);border-left:1px solid var(--line);overflow:auto;padding:8px;flex:none}
.cmem h4{margin:12px 8px 4px;font-size:11px;color:var(--mut);text-transform:uppercase}
.rtag{font-size:10px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:700}
.notice{padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--coral) 14%,transparent);border:1px solid var(--coral);margin:16px}
@media(max-width:900px){.cmem{display:none}.pgnav{width:64px}.pgnav span{display:none}}
.modalbg.gatebg{background:var(--bg,#111);z-index:9999}

/* ===== responsive: phone <700, tablet 700-1100, desktop ===== */
html,body{height:100dvh}
#app{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.ccomp{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.chat{position:relative;overflow:hidden}
.mnav,.mmem{display:none}.cscrim{display:none}
#tabs{overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
@media(pointer:coarse){.ib{min-width:40px;min-height:40px}input,textarea,select{font-size:16px!important}.ci{min-height:40px}}
@media(max-width:1100px){
  .mmem{display:inline-flex}

  .chat.dm .cmem{transform:none}
  .chat.dm .cscrim,.chat.ds .cscrim{display:block;position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.45)}
}
@media(min-width:700px) and (max-width:1100px){.cside{width:220px}.pgnav{width:200px}.pgnav span{display:inline}}
@media(max-width:699px){
  #toolbar{padding:6px 6px;gap:2px}#bBack,#bFwd,#bHome,#bBell{display:none}#omni{flex:1;min-width:0}
  #bmbar{display:none}#tabstrip{padding:6px 6px 0;min-height:38px}
  .mnav{display:inline-flex}
  .cside{position:absolute;top:0;left:0;bottom:0;width:min(300px,85%);z-index:30;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .chat.ds .cside{transform:none}
  .chead{padding:8px 10px}.ccomp{padding-left:10px;padding-right:10px}
  .modalbg{align-items:flex-end!important;padding:0!important}
  .modalbg .modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .modalbg.gatebg{align-items:center!important;padding:12px!important}.modalbg.gatebg .modal{border-radius:18px}
  .pgnav{width:54px;padding:12px 6px}.tiles{gap:12px}
}
@media(max-height:500px) and (orientation:landscape){#tabstrip{display:none}.cside{width:240px}}
</style>

const timeFmt=d=>{d=new Date(d);const n=new Date();const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toDateString()===n.toDateString()?t:d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+t};
function lum(hex){const c=hex.replace('#','');const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)/255}

const me=()=>S.user?S.user.id:null;
const myProfile=()=>S.user?(S.profiles.get(S.user.id)||S.profile||{}):{};
const rolesOf=id=>S.userRoles.filter(u=>u.user_id===id).map(u=>S.roles.find(r=>r.id===u.role_id)).filter(Boolean).sort((a,b)=>b.pos-a.pos);
const topRole=id=>rolesOf(id)[0];

const perm=p=>myRoles().some(r=>r.permissions?.administrator||r.permissions?.[p]);

const canAdmin=()=>perm('access_admin_panel')||perm('manage_roles')||perm('manage_channels');
const PRES_TTL=75000;
function vstatus(p){
  if(!p||!p.id)return'offline';
  if(p.id===me())return p.status||'online';
  if(p.status==='invisible')return'offline';
  const t=p.last_seen?Date.parse(p.last_seen):0;
  if(!t||Date.now()-t>PRES_TTL)return'offline';
  return p.status||'online';
}
let presT=null,presChk=null;
async function beat(){if(!S.user||!S.sb)return;const ts=new Date().toISOString();const r=S.profiles.get(me());if(r)r.last_seen=ts;await S.sb.from('profiles').update({last_seen:ts}).eq('id',me())}
function presSnap(){return [...S.profiles.values()].map(p=>p.id+vstatus(p)).join()}
function startPresence(){stopPresence();beat();presT=setInterval(beat,30000);S.snap=presSnap();
  presChk=setInterval(()=>{const n=presSnap();if(n!==S.snap){S.snap=n;liveRefresh()}},15000)}
function stopPresence(){clearInterval(presT);clearInterval(presChk)}
function goOffline(){if(!S.user||!S.token||!hasSB())return;try{fetch(`${CONFIG.SUPABASE_URL}/rest/v1/profiles?id=eq.${S.user.id}`,{method:'PATCH',keepalive:true,headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:JSON.stringify({last_seen:new Date(0).toISOString()})})}catch{}}
addEventListener('pagehide',goOffline);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')beat();else if(/Mobi|iPad|iPhone|Android/i.test(navigator.userAgent))goOffline()});
addEventListener('online',beat);
function av(p,size=36,dot=true){
  p=p||{};const st=vstatus(p);const name=p.display_name||p.username||'?';
  const bg=p.avatar_url?`background-image:url(${p.avatar_url})`:`background:hsl(${hue(name)} 45% 42%)`;
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${size*.42}px;${bg}">${p.avatar_url?'':esc(name[0].toUpperCase())}${dot?`<i class="sd st-${st}"></i>`:''}</div>`;
}
const pname=p=>p?(p.display_name||p.username):'unknown';

/* ============ supabase ============ */
const hasSB=()=>!CONFIG.SUPABASE_URL.startsWith('YOUR_')&&window.supabase;
async function initSB(){
  if(!hasSB())return;
  S.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  const {data}=await S.sb.auth.getSession();
  S.token=data.session?.access_token||null;
  if(data.session)await onLogin(data.session.user);
  S.sb.auth.onAuthStateChange((ev,sess)=>{S.token=sess?.access_token||null;if(ev==='SIGNED_IN'&&sess&&!S.user)onLogin(sess.user);if(ev==='SIGNED_OUT')onLogout()});
}
async function onLogin(user){
  S.user=user;await loadAll();subscribe();
  if(S.profile?.settings&&Object.keys(S.profile.settings).length){S.settings={...S.settings,...S.profile.settings};lsSet('fiji.settings',S.settings);applyTheme()}
  $$('.gatebg').forEach(x=>x.remove());renderChrome();refreshAll();startPresence();toast('Welcome, '+pname(myProfile()));
}
function onLogout(){stopPresence();S.user=null;S.profile=null;S.roles=[];S.userRoles=[];S.channels=[];S.msgs={};S.unread={};S.pings={};S.dmKeys=[];S.rt?.unsubscribe?.();renderChrome();refreshAll();authModal()}
async function loadAll(){
  const q=t=>S.sb.from(t).select('*');
  const [p,r,ur,ch]=await Promise.all([q('profiles'),q('roles'),q('user_roles'),q('channels').order('pos')]);
  S.profiles=new Map((p.data||[]).map(x=>[x.id,x]));S.roles=r.data||[];S.userRoles=ur.data||[];S.channels=ch.data||[];
  S.profile=S.profiles.get(S.user.id)||null;
  const d=await S.sb.from('messages').select('dm_key,created_at').not('dm_key','is',null).order('created_at',{ascending:false}).limit(300);
  S.dmKeys=[...new Set((d.data||[]).map(x=>x.dm_key))];
}
function subscribe(){
  S.rt=S.sb.channel('fiji-rt')
   .on('postgres_changes',{event:'*',schema:'public',table:'messages'},onMsg)
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},pl=>{const n=pl.new;if(n?.id){const o=S.profiles.get(n.id)||{};S.profiles.set(n.id,n);if(n.id===me())S.profile=n;const same=JSON.stringify({...o,last_seen:0})===JSON.stringify({...n,last_seen:0});if(!same){liveRefresh()}else{const x=presSnap();if(x!==S.snap){S.snap=x;liveRefresh()}}}})
   .on('postgres_changes',{event:'*',schema:'public',table:'roles'},async()=>{S.roles=(await S.sb.from('roles').select('*')).data||[];liveRefresh()})
   .on('postgres_changes',{event:'*',schema:'public',table:'user_roles'},async()=>{S.userRoles=(await S.sb.from('user_roles').select('*')).data||[];liveRefresh()})
   .on('postgres_changes',{event:'*',schema:'public',table:'channels'},async()=>{S.channels=(await S.sb.from('channels').select('*').order('pos')).data||[];liveRefresh()})
   .subscribe();
}
function liveRefresh(){const t=curTab();if(t?.route==='chat')Chat.render();if(t?.route==='admin')Admin.render();renderChrome()}
function refreshAll(){S.tabs.forEach(t=>{if(t.kind==='native')buildNative(t)});updateOmni()}

async function askNotif(){if(!('Notification' in window))return'unsupported';if(Notification.permission==='default')await Notification.requestPermission();return Notification.permission}
const ICON='data:image/svg+xml,'+encodeURIComponent(hib(64).replace('style="flex:none"','xmlns="http://www.w3.org/2000/svg"'));
async function notify(title,body,key,tag){
  S.notifs.unshift({title,body,key,ts:Date.now()});S.notifs=S.notifs.slice(0,40);renderChrome();
  if(S.settings.sound)beep();

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch{}}
const totalPings=()=>Object.values(S.pings).reduce((a,b)=>a+b,0);

/* ============ tabs / navigation ============ */
const FAVS=[['games','Games',IC.game,'internal'],['movies','Movies',IC.movie,'internal'],['music','Music',IC.music,'internal'],['chat','Chat',IC.chat,'native'],['settings','Settings',IC.gear,'native']];
const NATIVE_META={newtab:['New Tab',IC.globe],settings:['Settings',IC.gear],admin:['Admin Panel',IC.shield],chat:['Chat',IC.chat],history:['History',IC.clock],notfound:['Not found',IC.info]};
const INTERNAL={games:['Games',IC.game],movies:['Movies',IC.movie],music:['Music',IC.music]};
const curTab=()=>S.tabs.find(t=>t.id===S.active);
function resolve(raw){
  raw=(raw||'').trim();
  if(!raw)return{k:'native',r:'newtab',url:'fiji://newtab'};
  if(/^fiji:\/\//i.test(raw)){
    const r=raw.slice(7).replace(/\/+$/,'').toLowerCase().split(/[/?#]/)[0]||'newtab';
    if(INTERNAL[r])return{k:'internal',r,url:'fiji://'+r};
    if(NATIVE_META[r])return{k:'native',r,url:'fiji://'+r};
    return{k:'native',r:'notfound',url:raw};
  }
  if(/^https?:\/\//i.test(raw))return{k:'page',url:raw};
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?([/?#]\S*)?$/.test(raw)||/^localhost(:\d+)?/.test(raw))return{k:'page',url:'https://'+raw};
  return{k:'page',url:ENGINES[S.settings.engine][1]+encodeURIComponent(raw),q:raw};
}
function newTab(raw,opts={}){
  const t={id:uid(),kind:'native',route:'newtab',url:'fiji://newtab',title:'New Tab',hist:[],hi:-1,loading:false,pinned:false,...opts};
  S.tabs.push(t);const v=document.createElement('div');v.className='view';v.id='v-'+t.id;$('#views').append(v);t.el=v;
  navigate(t,raw??S.settings.home,true);activate(t.id);return t;
}
function navigate(t,raw,push=true){
  const r=resolve(raw);
  if(push){t.hist=t.hist.slice(0,t.hi+1);t.hist.push(raw);t.hi=t.hist.length-1}
  t.el.innerHTML='';t.el.classList.remove('fr');
  if(r.k==='native'){t.kind='native';t.route=r.r;t.url=r.url;t.title=NATIVE_META[r.r][0];buildNative(t)}
  else if(r.k==='internal'){t.kind='internal';t.route=r.r;t.url=r.url;t.title=INTERNAL[r.r][0];frame(t,`${r.r}/index.html`)}
  else{t.kind='page';t.route=null;t.url=r.url;try{t.title=new URL(r.url).hostname}catch{t.title=r.url}frame(t,proxyBase()+encodeURIComponent(r.url));addHistory(t)}
  renderTabs();updateOmni();
}
function frame(t,src){
  t.loading=true;t.el.classList.add('fr');
  const f=document.createElement('iframe');f.allow='fullscreen; autoplay; clipboard-write; encrypted-media; gamepad; microphone; camera';
  f.addEventListener('load',()=>{t.loading=false;
    try{const d=f.contentDocument;if(d&&d.title&&t.kind==='internal')t.title=d.title}catch{}
    renderTabs()});
  f.addEventListener('error',()=>{t.loading=false;renderTabs()});
  f.src=src;t.el.append(f);t.frame=f;renderTabs();
}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='fiji-nav')return;
  const t=S.tabs.find(x=>x.frame&&x.frame.contentWindow===e.source);if(!t)return;
  if(d.title)t.title=String(d.title).slice(0,80);if(d.url&&t.kind==='page')t.url=String(d.url);renderTabs();updateOmni()
});
function addHistory(t){if(/^https?:/.test(t.url)){S.history.unshift({url:t.url,title:t.title,ts:Date.now()});S.history=S.history.slice(0,300);lsSet('fiji.hist',S.history)}}
function activate(id){
  S.active=id;S.tabs.forEach(t=>t.el.classList.toggle('on',t.id===id));
  const t=curTab();if(t?.route==='chat')Chat.render();
  renderTabs();updateOmni();
}
function closeTab(id){
  const i=S.tabs.findIndex(t=>t.id===id);if(i<0)return;
  const t=S.tabs[i];t.el.remove();S.tabs.splice(i,1);
  if(!S.tabs.length)return newTab(S.settings.home);
  if(S.active===id)activate(S.tabs[Math.min(i,S.tabs.length-1)].id);else renderTabs();
}
function openNative(route){
  const ex=S.tabs.find(t=>t.route===route&&t.kind!=='page');
  if(ex){activate(ex.id);return ex}
  return newTab('fiji://'+route);
}
function openFav(name,kind){
  if(kind==='internal'||kind==='native'){const ex=S.tabs.find(t=>t.route===name);if(ex)return activate(ex.id);const cur=curTab();if(cur&&cur.route==='newtab'&&cur.hist.length===1){navigate(cur,'fiji://'+name);return}newTab('fiji://'+name)}
}
function renderTabs(){
  const box=$('#tabs');box.innerHTML='';
  S.tabs.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).forEach(t=>{
    const e=document.createElement('div');e.className='tab'+(t.id===S.active?' active':'')+(t.pinned?' pinned':'');e.draggable=true;e.title=t.title;
    let ico;if(t.loading)ico='<div class="spin"></div>';else if(t.kind==='page'){let h='';try{h=new URL(t.url).hostname}catch{}ico=`<img src="https://www.google.com/s2/favicons?sz=32&domain=${h}" onerror="this.style.display='none'">`}
    else ico=(INTERNAL[t.route]||NATIVE_META[t.route]||NATIVE_META.notfound)[1](16);
    e.innerHTML=`<span class="fi">${ico}</span><span class="tt">${esc(t.title)}</span><span class="tx">${IC.x(12)}</span>`;
    e.onclick=ev=>{if(ev.target.closest('.tx'))closeTab(t.id);else activate(t.id)};
    e.onauxclick=ev=>{if(ev.button===1)closeTab(t.id)};
    e.oncontextmenu=ev=>{ev.preventDefault();tabMenu(ev,t)};
    e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',t.id);e.classList.add('drag')};
    e.ondragend=()=>e.classList.remove('drag');
    e.ondragover=ev=>ev.preventDefault();
    e.ondrop=ev=>{ev.preventDefault();const from=ev.dataTransfer.getData('text/plain');const a=S.tabs.findIndex(x=>x.id===from),b=S.tabs.findIndex(x=>x.id===t.id);if(a<0||a===b)return;const [m]=S.tabs.splice(a,1);S.tabs.splice(b,0,m);renderTabs()};
    box.append(e);
  });
}
function popMenu(x,y,items){

function shrink(file,w,h){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.max(w/im.width,h/im.height);const sw=w/sc,sh=h/sc;c.width=w;c.height=h;c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

        const st=myProfile()?.status;
        if(st!=='dnd'&&((dm&&S.settings.notifDm)||(ping&&S.settings.notifPing))){
          const a=S.profiles.get(m.author_id);const ch=S.channels.find(c=>c.id===m.channel_id);
          notify(dm?pname(a):`${pname(a)} pinged you${ch?' in #'+ch.name:''}`,m.content.slice(0,120),key,key)}}
    }
  }else if(pl.eventType==='UPDATE'&&m){const k=Chat.keyOf(m);const a=S.msgs[k];if(a){const i=a.findIndex(x=>x.id===m.id);if(i>=0)a[i]=m}}
  else if(pl.eventType==='DELETE'&&old){for(const k in S.msgs)S.msgs[k]=S.msgs[k].filter(x=>x.id!==old.id)}
  renderChrome();const t=curTab();if(t?.route==='chat')Chat.render();
}

/* ============ boot ============ */
(async function boot(){
  applyTheme();renderChrome();initSW();
  newTab(S.settings.home);
  try{await initSB()}catch(e){console.error(e);toast('Supabase failed: '+e.message)}
  renderChrome();if(!S.user)authModal();
  document.addEventListener('click',e=>{const a=e.target.closest('a[data-link]');if(a){e.preventDefault();newTab(a.dataset.link)}});
})();
</script>
</body>
