.pk{position:relative;padding:20px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 24%,var(--tool)),var(--tool));border:1px solid color-mix(in srgb,var(--pc) 45%,var(--line));display:flex;flex-direction:column;gap:10px;transition:transform .25s var(--spring)}.pk:hover{transform:translateY(-4px)}
.pk .pic{width:78px;height:78px;border-radius:22px;background:var(--pc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--pc) 50%,transparent)}
.odds{display:flex;flex-direction:column;gap:3px;font-size:12px}.odds div{display:flex;justify-content:space-between}.odds b{color:var(--rc)}
.packstage{padding:30px 10px 10px}.packbox{width:120px;height:120px;border-radius:30px;margin:10px auto 20px;display:grid;place-items:center;background:var(--pc,var(--accent));color:#fff;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.05)}80%{transform:rotate(6deg)}}

@keyframes bit{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.claimbig{font-family:var(--logo);font-size:54px;color:#ffc933;margin:6px 0}

@media(max-width:900px){.cmem{display:none}.pgnav{width:64px}.pgnav span,.pgnav .gl{display:none}#ai.open{width:100%;position:fixed;inset:0;z-index:50}.pgbody{padding:20px 16px 90px}.shead{grid-template-columns:1fr}}
</style>

<body>

<script>
'use strict';
/* ============ CONFIG ============ */
const CONFIG={
  SUPABASE_URL:'YOUR_SUPABASE_URL',
  SUPABASE_ANON_KEY:'YOUR_SUPABASE_ANON_KEY',
  GROQ_API_KEY:'YOUR_GROQ_API_KEY',
  GROQ_MODEL:'qwen/qwen3.8-27b',
  PROXY:'https://engine-p8vd.onrender.com/browse?url=',
  FREE_CREDITS:100000,PREMIUM_CREDITS:300000,
  FAKE_DOMAIN:'fiji.local',          // username-only accounts sign in as username@this-domain (no mail is ever sent)
  CUSTOM_TAG_PRICE:7500
};
const PALETTE=['#57abb0','#2596be','#db5844','#135751','#134f5b','#f6f1e6','#c678dd','#ffc933'];
const ENGINES={ddg:['DuckDuckGo','https://duckduckgo.com/html/?q='],bing:['Bing','https://www.bing.com/search?q='],google:['Google','https://www.google.com/search?q='],brave:['Brave','https://search.brave.com/search?q=']};
const PERMS=[['administrator','Administrator','Every permission; bypasses all checks'],['access_admin_panel','Access admin panel','Can open fiji://admin'],['manage_roles','Manage roles','Create, edit, assign roles lower than their own'],['manage_channels','Manage channels','Create and delete channels'],['delete_messages','Delete messages','Delete anyone\'s messages'],['ping_everyone','Ping @everyone / @here','Mass pings'],['premium_ai','Premium AI','300k Sakuna credits instead of 100k'],['ban_users','Ban users','Account, device and IP bans'],['warn_users','Warn users','Issue warnings'],['view_reports','View reports','Review the report queue'],['manage_economy','Manage economy','Grant coins and items']];
const RAR={common:['Common','var(--c-common)'],uncommon:['Uncommon','var(--c-uncommon)'],rare:['Rare','var(--c-rare)'],epic:['Epic','var(--c-epic)'],legendary:['Legendary','var(--c-legendary)']};
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';

/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=n=>Number(n||0).toLocaleString();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const timeFmt=d=>{d=new Date(d);const n=new Date();const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toDateString()===n.toDateString()?t:d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+t};
function lum(hex){const c=hex.replace('#','');const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)/255}
function toast(t,icon){const e=document.createElement('div');e.className='toast';e.innerHTML=(icon?ic(icon,16):'')+`<span>${esc(t)}</span>`;$('#toasts').append(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),260)},3200)}
const ic=(n,s=18)=>`<iconify-icon icon="${n.includes(':')?n:'lucide:'+n}" width="${s}" height="${s}"></iconify-icon>`;
const hib=(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" style="flex:none"><g fill="#db5844" stroke="#f6f1e6" stroke-opacity=".5" stroke-width="1.2" stroke-linejoin="round">${[0,72,144,216,288].map(a=>`<path transform="rotate(${a} 32 32)" d="M32 32C20 28 17 12 32 4C47 12 44 28 32 32Z"/>`).join('')}</g><path d="M32 32 41 14" stroke="#f6f1e6" stroke-width="2.4" stroke-linecap="round"/><circle cx="41.5" cy="13" r="2.8" fill="#f6f1e6"/><circle cx="32" cy="32" r="4" fill="#f6f1e6"/></svg>`;
function hex2hsv(hex){hex=(hex||'#57abb0').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return'#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}

/* ============ settings / state ============ */
const DEF={accent:'#57abb0',mode:'auto',radius:10,compact:false,bmBar:true,showCoins:true,home:'fiji://newtab',engine:'ddg',notif:true,notifDm:true,notifPing:true,sound:true,aiPage:true,aiTemp:.6,aiTone:'balanced',fontSize:14,tabShape:'round',proxy:''};
const S={settings:{...DEF,...lsGet('fiji.settings',{})},tabs:[],active:null,sb:null,user:null,profile:null,guest:lsGet('fiji.guest',{username:'guest',display_name:'Guest',bio:'',avatar_url:'',banner_url:'',status:'online'}),
  profiles:new Map(),roles:[],userRoles:[],channels:[],msgs:{},unread:{},pings:{},dmKeys:[],notifs:[],bookmarks:lsGet('fiji.bm',[]),history:lsGet('fiji.hist',[]),
  items:new Map(),packs:[],inv:{},trades:[],warns:[],ban:null};
const proxyBase=()=>S.settings.proxy||CONFIG.PROXY;
function saveSettings(){lsSet('fiji.settings',S.settings);applyTheme();if(S.sb&&S.user)S.sb.from('profiles').update({settings:S.settings}).eq('id',S.user.id).then(()=>{})}
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?.('change',applyTheme);
function applyTheme(){
  const s=S.settings,r=document.documentElement;
  r.style.setProperty('--accent',s.accent);r.style.setProperty('--on-accent',lum(s.accent)>.62?'#111':'#fff');
  r.style.setProperty('--r',s.radius+'px');r.style.setProperty('--fs',s.fontSize+'px');
  r.dataset.mode=s.mode==='auto'?(mq.matches?'dark':'light'):s.mode;
  document.body.dataset.tabshape=s.tabShape;document.body.dataset.bmbar=s.bmBar?'on':'off';
}

/* ============ users / roles / items ============ */
const me=()=>S.user?S.user.id:null;
const myProfile=()=>S.user?(S.profiles.get(S.user.id)||S.profile):S.guest;
const rolesOf=id=>S.userRoles.filter(u=>u.user_id===id).map(u=>S.roles.find(r=>r.id===u.role_id)).filter(Boolean).sort((a,b)=>b.pos-a.pos);
const topRole=id=>rolesOf(id)[0];
const myRoles=()=>me()?rolesOf(me()):[];
const isOwner=()=>myRoles().some(r=>r.permissions?.administrator);
const perm=p=>myRoles().some(r=>r.permissions?.administrator||r.permissions?.[p]);
const myPos=()=>Math.max(0,...myRoles().map(r=>r.pos));
const canAdmin=()=>['access_admin_panel','manage_roles','manage_channels','ban_users','warn_users','view_reports','manage_economy'].some(perm);
const aiLimit=()=>perm('premium_ai')?CONFIG.PREMIUM_CREDITS:CONFIG.FREE_CREDITS;
const aiUsed=()=>me()?(myProfile()?.ai_used||0):lsGet('fiji.aiused',0);
function vstatus(p){if(!p)return'offline';if(p.status==='invisible'&&p.id!==me())return'offline';return p.status||'online'}
function av(p,size=36,dot=true){
  p=p||{};const st=vstatus(p);const name=p.display_name||p.username||'?';
  const bg=p.avatar_url?`background-image:url('${p.avatar_url}')`:`background:hsl(${hue(name)} 45% 42%)`;
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${size*.42}px;${bg}">${p.avatar_url?'':esc(name[0].toUpperCase())}${dot?`<i class="sd st-${st}"></i>`:''}</div>`;
}
const pname=p=>p?(p.display_name||p.username):'unknown';
const itemById=id=>id?S.items.get(id):null;

const firstColor=c=>(c&&c.match(/#[0-9a-f]{3,8}/i)?.[0])||'var(--accent)';
const nameHtml=p=>`<span class="nm${nameItem(p)?.data.anim?' anim':''}" style="${nameStyle(p)}">${esc(pname(p))}</span>`;
function tagHtml(p){if(!p?.tag_text)return'';const fc=firstColor(nameCss(p)),icon=itemById(p.tag_icon);return `<span class="gtag" style="--tc:${fc}">${icon?ic(icon.data.icon,12):''}<span>${esc(p.tag_text)}</span></span>`}
const bannerStyle=p=>p.banner_url?`background-image:url('${p.banner_url}')`:p.banner_color?`background:${esc(p.banner_color)}`:'';
function patchMe(o){if(!S.user)return;S.profile={...S.profile,...o};S.profiles.set(me(),S.profile)}
function effStreak(p){if(!p?.last_claim)return 0;const fmt=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);return(p.last_claim===fmt(new Date())||p.last_claim===fmt(new Date(Date.now()-864e5)))?p.streak:0}

function mkSlider(h,o){h.className='sl';h.innerHTML='<div class="slt"><i class="slf"></i></div><b class="slk"></b><em class="slv"></em>';h.tabIndex=0;let v=o.value;const st=o.step||1;

function ctxItems(t){
  const ed=t.closest('input,textarea');
  if(ed){const sel=ed.selectionStart!==ed.selectionEnd;return[
    {label:'Cut',icon:'scissors',disabled:!sel||ed.readOnly,fn:()=>document.execCommand('cut')},{label:'Copy',icon:'copy',disabled:!sel,fn:()=>document.execCommand('copy')},
    {label:'Paste',icon:'clipboard-paste',fn:async()=>{try{const x=await navigator.clipboard.readText();ed.focus();ed.setRangeText(x,ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input',{bubbles:true}))}catch{toast('Your browser blocked clipboard access')}}},
    {label:'Select all',icon:'text-cursor',fn:()=>ed.select()}]}
  const c=t.closest('[data-ctx]');const sel=getSelection().toString().trim();const out=[];
  if(sel)out.push({label:'Copy',icon:'copy',key:'Ctrl+C',fn:()=>navigator.clipboard.writeText(sel)},{label:'Ask Sakuna about this',icon:'sparkles',fn:()=>aiSend('Explain this: "'+sel.slice(0,500)+'"')},{label:`Search for "${sel.slice(0,24)}"`,icon:'search',fn:()=>newTab(sel)});
  if(c?.dataset.ctx==='msg'){const m=Chat.find(c.dataset.id);if(m){const a=S.profiles.get(m.author_id);if(out.length)out.push('-');
    out.push({label:'Copy text',icon:'copy',fn:()=>navigator.clipboard.writeText(m.content)});
    if(m.author_id===me())out.push({label:'Edit message',icon:'pencil',fn:()=>Chat.edit(m)});
    out.push('-',...userMenu(a));
    out.push('-',{label:'Report message',icon:'flag',fn:()=>reportModal({userId:m.author_id,msg:m}),disabled:!S.user||m.author_id===me()});
    if(m.author_id===me()||perm('delete_messages'))out.push({label:'Delete message',icon:'trash-2',danger:true,fn:()=>Chat.del(m)})}}
  else if(c?.dataset.ctx==='user'){const p=S.profiles.get(c.dataset.uid);if(p)return[...out,...(out.length?['-']:[]),...userMenu(p)]}
  else if(c?.dataset.ctx==='bm'){const i=+c.dataset.i;return[{label:'Open in new tab',icon:'external-link',fn:()=>newTab(S.bookmarks[i].url)},{label:'Remove bookmark',icon:'trash-2',danger:true,fn:()=>{S.bookmarks.splice(i,1);lsSet('fiji.bm',S.bookmarks);renderBm();updateOmni()}}]}
  else if(c?.dataset.ctx==='tab'){return tabMenuItems(S.tabs.find(x=>x.id===c.dataset.id))}
  if(c&&!out.length)return[];
  const a=t.closest('a[data-link],a[data-u]');if(a)out.push({label:'Open link in new tab',icon:'external-link',fn:()=>newTab(a.dataset.link||a.dataset.u)});
  const tab=curTab();if(out.length)out.push('-');
  out.push({label:'Back',icon:'arrow-left',key:'Alt+←',disabled:!tab||tab.hi<=0,fn:goBack},{label:'Forward',icon:'arrow-right',key:'Alt+→',disabled:!tab||tab.hi>=tab.hist.length-1,fn:goFwd},{label:'Reload',icon:'rotate-cw',key:'Alt+R',fn:()=>reload()},'-',
    {label:'Bookmark this page',icon:'star',fn:toggleBookmark},{label:'Ask Sakuna about this page',icon:'sparkles',key:'Alt+J',fn:()=>{toggleAI(true);$('#aiIn')?.focus()}},{label:'New tab',icon:'plus',key:'Alt+T',fn:()=>newTab()});
  return out;
}

async function initSB(){
  if(!hasSB())return;
  S.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  S.sb.auth.onAuthStateChange((ev,sess)=>{
    if(sess)Acc.save(sess);
    if(ev==='PASSWORD_RECOVERY'){setTimeout(newPasswordModal,50);return}
    if(ev==='SIGNED_OUT'){if(S.user)setTimeout(onLogout,0);return}
    if(sess&&(!S.user||sess.user.id!==S.user.id))setTimeout(()=>onLogin(sess.user),0)});

  if(data.session){Acc.save(data.session);await onLogin(data.session.user)}else Dev.check();

function subscribe(){

   .on('postgres_changes',{event:'*',schema:'public',table:'messages'},onMsg)
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},pl=>{if(pl.new?.id){S.profiles.set(pl.new.id,pl.new);if(pl.new.id===me())S.profile=pl.new;liveRefresh()}})
   .on('postgres_changes',{event:'*',schema:'public',table:'roles'},async()=>{S.roles=(await S.sb.from('roles').select('*')).data||[];liveRefresh()})
   .on('postgres_changes',{event:'*',schema:'public',table:'user_roles'},async()=>{S.userRoles=(await S.sb.from('user_roles').select('*')).data||[];liveRefresh()})
   .on('postgres_changes',{event:'*',schema:'public',table:'channels'},async()=>{S.channels=(await S.sb.from('channels').select('*').order('pos')).data||[];liveRefresh()})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},pl=>{if(pl.new.user_id===me()){notify(pl.new.title,pl.new.body||'',null,'n'+pl.new.id)}})
   .on('postgres_changes',{event:'*',schema:'public',table:'warnings'},async()=>{S.warns=(await S.sb.from('warnings').select('*').eq('user_id',me()).eq('ack',false)).data||[];showWarnings()})
   .on('postgres_changes',{event:'*',schema:'public',table:'inventory'},async pl=>{const r=pl.new?.user_id?pl.new:pl.old;if(r?.user_id===me()){const iv=await S.sb.from('inventory').select('*').eq('user_id',me());S.inv=Object.fromEntries((iv.data||[]).map(x=>[x.item_id,x.qty]));liveRefresh()}})

function resolve(raw){
  raw=(raw||'').trim();
  if(!raw)return{k:'native',r:'newtab',url:'fiji://newtab'};
  if(/^fiji:\/\//i.test(raw)){const parts=raw.slice(7).replace(/\/+$/,'').toLowerCase().split(/[/?#]/);const r=parts[0]||'newtab';
    if(INTERNAL[r])return{k:'internal',r,url:'fiji://'+r};if(r==='ai')return{k:'ai'};
    if(NATIVE_META[r])return{k:'native',r,url:'fiji://'+r,sub:parts[1]};return{k:'native',r:'notfound',url:raw}}
  if(/^https?:\/\//i.test(raw))return{k:'page',url:raw};
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?([/?#]\S*)?$/.test(raw)||/^localhost(:\d+)?/.test(raw))return{k:'page',url:'https://'+raw};
  return{k:'page',url:ENGINES[S.settings.engine][1]+encodeURIComponent(raw),q:raw};
}
function newTab(raw,opts={}){

  S.tabs.push(t);const v=document.createElement('div');v.className='view';v.id='v-'+t.id;$('#views').append(v);t.el=v;
  navigate(t,raw??S.settings.home,true);activate(t.id);return t;

function navigate(t,raw,push=true){

  t.el.innerHTML='';t.el.classList.remove('fr');clearTimeout(t._lt);
  if(r.k==='native'){t.kind='native';t.route=r.r;t.url=r.url;t.title=NATIVE_META[r.r][0];if(r.r==='settings'&&r.sub&&Settings.valid(r.sub))Settings.tab=r.sub;buildNative(t)}
  else if(r.k==='internal'){t.kind='internal';t.route=r.r;t.url=r.url;t.title=INTERNAL[r.r][0];frame(t,`${r.r}/index.html`)}
  else{t.kind='page';t.route=null;t.url=r.url;try{t.title=new URL(r.url).hostname}catch{t.title=r.url}frame(t,proxyBase()+encodeURIComponent(r.url));addHistory(t)}

  f.addEventListener('load',done);f.addEventListener('error',done);t._lt=setTimeout(done,12000);

}

/* omnibox suggestions */
let osIdx=-1,osItems=[];
function omniSugg(){const q=$('#oInput').value.trim(),box=$('#osug');if(!q){box.classList.remove('show');return}const ql=q.toLowerCase();
  osItems=[{i:'search',t:q,s:'Search '+ENGINES[S.settings.engine][0],go:q}];
  FAVS.filter(f=>f[3]!=='ai'&&(f[1].toLowerCase().includes(ql)||f[0].includes(ql))).forEach(f=>osItems.push({i:f[2],t:f[1],s:'fiji://'+f[0],go:'fiji://'+f[0]}));
  const seen=new Set();[...S.bookmarks.map(b=>({...b,i:'star'})),...S.history.slice(0,200).map(h=>({...h,i:'clock'}))].filter(x=>(x.title+x.url).toLowerCase().includes(ql)&&!seen.has(x.url)&&seen.add(x.url)).slice(0,6).forEach(x=>osItems.push({i:x.i,t:x.title||x.url,s:x.url.replace(/^https?:\/\//,'').slice(0,40),go:x.url}));
  osIdx=0;drawSugg();box.classList.add('show')}
function drawSugg(){$('#osug').innerHTML=osItems.map((x,i)=>`<button class="${i===osIdx?'on':''}" data-i="${i}"><span class="mic" style="color:var(--mut)">${ic(x.i,16)}</span><span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('');
  $$('#osug button').forEach(b=>b.onmousedown=e=>{e.preventDefault();$('#osug').classList.remove('show');$('#oInput').blur();navigate(curTab(),osItems[+b.dataset.i].go)})}
$('#oInput').addEventListener('input',omniSugg);
$('#oInput').addEventListener('keydown',e=>{
  const open=$('#osug').classList.contains('show');
  if(e.key==='ArrowDown'&&open){e.preventDefault();osIdx=(osIdx+1)%osItems.length;drawSugg()}
  else if(e.key==='ArrowUp'&&open){e.preventDefault();osIdx=(osIdx-1+osItems.length)%osItems.length;drawSugg()}
  else if(e.key==='Enter'){const v=open&&osIdx>0?osItems[osIdx].go:e.target.value;$('#osug').classList.remove('show');e.target.blur();navigate(curTab(),v)}
  else if(e.key==='Escape'){$('#osug').classList.remove('show');e.target.blur();updateOmni()}});
$('#oInput').addEventListener('focus',e=>e.target.select());$('#oInput').addEventListener('blur',()=>{setTimeout(()=>$('#osug').classList.remove('show'),120);updateOmni()});

const Eco={
  today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date())},
  canClaim(){return !!S.user&&!!myProfile()&&myProfile().last_claim!==Eco.today()},
  async claim(){const {data}=await rpc('claim_daily',{p_tz:TZ});if(!data)return;patchMe({coins:data.coins,streak:data.streak,last_claim:data.day,best_streak:Math.max(data.streak,myProfile().best_streak||0)});renderChrome();Shop.render();
    const m=Ui.modal(`<div style="text-align:center"><div class="flame" style="margin:0 auto;width:84px;height:84px;animation:flick 1s infinite">${ic('flame',48)}</div><h2 style="margin-top:12px">Day ${data.streak} streak!</h2><div class="claimbig">+<span id="cn">0</span></div><p class="mut">coins added to your balance · come back tomorrow (${esc(TZ)})</p><button class="btn" id="ck" style="margin-top:10px">Nice</button></div>`,{cls:'sm'});
    $('#ck',m).onclick=()=>m.close();let n=0;const iv=setInterval(()=>{n=Math.min(data.gain,n+Math.ceil(data.gain/22));$('#cn',m)&&($('#cn',m).textContent=n);if(n>=data.gain)clearInterval(iv)},30)},
  async buy(it){if(!await Ui.confirm('Buy '+it.name+'?',`This costs ${num(it.price)} coins.`,{ok:'Buy'}))return;const {error}=await rpc('buy_item',{p_item:it.id});if(error)return;S.inv[it.id]=1;patchMe({coins:myProfile().coins-it.price});toast('Purchased '+it.name,'shopping-bag');renderChrome();Shop.render()},
  async equip(slot,id){const {error}=await rpc('equip',{p_slot:slot,p_item:id});if(error)return false;patchMe({[slot]:id});renderChrome();renderTabs();return true},
  async setTag(text,preset){const {error}=await rpc('set_tag',{p_text:text,p_preset:preset});if(error)return false;patchMe({tag_text:preset?itemById(preset).data.text:(text?text.toUpperCase().trim():null)});renderChrome();return true},
  async unlockTag(){if(!await Ui.confirm('Unlock custom tag?',`${num(CONFIG.CUSTOM_TAG_PRICE)} coins, once. You can change the text as often as you like afterwards.`,{ok:'Unlock'}))return false;const {error}=await rpc('buy_custom_tag');if(error)return false;patchMe({custom_tag:true,coins:myProfile().coins-CONFIG.CUSTOM_TAG_PRICE});renderChrome();return true}
};

const Shop={tab:'store',filter:'all',
mount(v){this.v=v;this.render()},
render(){const v=this.v;if(!v||!v.isConnected&&!S.tabs.some(t=>t.el===v))return;
  if(!S.user){v.innerHTML=`<div class="nt"><h1 style="font-size:46px">${ic('shopping-bag',44)} Shop</h1><p class="mut">Sign in to collect daily coins, build a streak, open packs, gift and trade.</p><button class="btn" id="si">Sign in / Sign up</button></div>`;$('#si',v).onclick=()=>authModal();return}
  const p=myProfile();if(!p)return;const st=effStreak(p),can=Eco.canClaim();const sc=v.querySelector('.pgscroll')?.scrollTop;
  v.innerHTML=`<div class="shop"><div class="shead"><div class="scard streak ${can?'ready':''}"><div class="flame">${ic('flame',32)}</div><div><span class="big">${st}</span>day streak<small class="mut">Best ${p.best_streak||0} · resets by your time zone (${esc(TZ)})</small></div><button class="btn" id="claim" ${can?'':'disabled'}>${can?'Claim daily reward':'Back tomorrow'}</button></div>
    <div class="scard coins">${ic('coins',30)}<div><span class="big">${num(p.coins)}</span><small class="mut">coins</small></div></div></div><div id="stabs"></div><div id="sbody" class="sbody"></div></div>`;
  mkSeg($('#stabs',v),{options:[['store','Store'],['packs','Packs'],['inv','Inventory'],['trades','Trades'+(pendingIn()?` (${pendingIn()})`:'')]],value:this.tab,onChange:k=>{this.tab=k;this.body(true)}});
  $('#claim',v).onclick=()=>Eco.claim();this.body(false)},
body(anim){const b=$('#sbody',this.v);if(!b)return;if(anim){b.classList.remove('anim');void b.offsetWidth;b.classList.add('anim')}b.onclick=null;this['t_'+this.tab](b)},
equipped(it){const p=myProfile();return it.kind==='name_color'?p.name_color===it.id:it.kind==='tag_preset'?p.tag_text===it.data.text:(p.tab_icon===it.id||p.tag_icon===it.id)},
card(it,o={}){const R=RAR[it.rarity],own=owned(it.id),eq=this.equipped(it);let act='';
  if(o.inv){act=`<div class="row2">${it.kind==='icon'?`<button class="btn sm ghost" data-do="equipicon">Use</button>`:`<button class="btn sm ${eq?'ghost':''}" data-do="equip">${eq?'Equipped':'Equip'}</button>`}<button class="btn sm ghost" data-do="gift">Gift</button></div>${it.kind==='icon'&&qtyOf(it.id)>1?`<button class="btn sm ghost" data-do="sell" style="width:100%">Sell dupe (${num({common:25,uncommon:75,rare:250,epic:800,legendary:3000}[it.rarity])})</button>`:''}`}
  else act=own?`<button class="btn sm ${eq?'ghost':''}" data-do="equip">${eq?'Equipped':'Equip'}</button>`:`<button class="btn sm" data-do="buy" ${myProfile().coins<it.price?'style="opacity:.6"':''}>${ic('coins',14)} ${num(it.price)}</button>`;
  return `<div class="icard" style="--rc:${R[1]}" data-id="${it.id}"><span class="rch">${R[0]}</span>${o.inv?`<span class="qty">${isOwner()?'∞':'×'+qtyOf(it.id)}</span>`:''}<div class="vis">${itemVisual(it)}</div><b>${esc(it.name)}</b>${act}</div>`},
async act(bt){const id=bt.closest('[data-id]').dataset.id,it=itemById(id);if(!it)return;const d=bt.dataset.do;
  if(d==='buy')return Eco.buy(it);
  if(d==='equip'){if(it.kind==='name_color'){if(await Eco.equip('name_color',this.equipped(it)?null:id))this.render()}else if(it.kind==='tag_preset'){if(await Eco.setTag(null,id))this.render()}return}
  if(d==='equipicon'){const r=bt.getBoundingClientRect();return popMenu(r.left,r.bottom+4,[{label:'Use as tab icon',icon:'app-window',check:myProfile().tab_icon===id,fn:async()=>{if(await Eco.equip('tab_icon',id))this.render()}},{label:'Use as tag icon',icon:'tag',check:myProfile().tag_icon===id,fn:async()=>{if(await Eco.equip('tag_icon',id))this.render()}}])}
  if(d==='gift')return giftModal({item:id});
  if(d==='sell'){const q=qtyOf(id)-1;const {data}=await rpc('sell_item',{p_item:id,p_qty:q});if(data!=null){S.inv[id]=1;patchMe({coins:myProfile().coins+data});toast('Sold for '+num(data)+' coins','coins');renderChrome();this.render()}}},
t_store(b){const cols=[...S.items.values()].filter(i=>i.kind==='name_color').sort(byPrice),tags=[...S.items.values()].filter(i=>i.kind==='tag_preset').sort(byPrice),p=myProfile();
  b.innerHTML=`<h3>Name colors</h3><p class="mut" style="margin-top:-6px">Shows on your name everywhere. Your guild tag always matches it.</p><div class="grid">${cols.map(i=>this.card(i)).join('')}</div>
   <h3>Guild tags</h3><p class="mut" style="margin-top:-6px">A short tag beside your name. Pick a preset below, or unlock a fully custom one.</p><div class="grid">${tags.map(i=>this.card(i)).join('')}
   <div class="icard" style="--rc:var(--c-legendary)"><span class="rch">Custom</span><div class="vis"><span class="gtag" style="--tc:${firstColor(nameCss(p))};font-size:13px;height:22px;padding:0 9px">${esc(p.tag_text||'YOU')}</span></div><b>Custom tag</b>${p.custom_tag||isOwner()?`<input class="inp" id="ctx" maxlength="5" placeholder="2–5 letters" style="text-align:center;text-transform:uppercase"><button class="btn sm" data-do="ctag">Apply</button>`:`<button class="btn sm" data-do="uctag">${ic('coins',14)} ${num(CONFIG.CUSTOM_TAG_PRICE)}</button>`}</div></div>`;
  b.onclick=async e=>{const bt=e.target.closest('[data-do]');if(!bt)return;if(bt.dataset.do==='uctag'){if(await Eco.unlockTag())this.render()}else if(bt.dataset.do==='ctag'){const v=$('#ctx',b).value;if(await Eco.setTag(v,null)){toast('Tag updated','tag');this.render()}}else this.act(bt)}},
t_packs(b){b.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${S.packs.map(pk=>{const pool=[...S.items.values()].filter(i=>i.pack_id===pk.id);return `<div class="pk" style="--pc:${esc(pk.color)}"><div class="pic">${ic('package',40)}</div><div><b style="font-size:18px">${esc(pk.name)}</b><div class="mut">${esc(pk.description)}</div></div>
    <div class="odds">${Object.entries(pk.weights).map(([k,w])=>`<div style="--rc:${RAR[k][1]}"><span>${RAR[k][0]}</span><b>${w}%</b></div>`).join('')}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;color:var(--mut)">${pool.slice(0,12).map(i=>`<span style="color:${RAR[i.rarity][1]}">${ic(i.data.icon,18)}</span>`).join('')}</div>
    <button class="btn" data-pk="${pk.id}">${isOwner()?'Open (free for owner)':ic('coins',15)+' '+num(pk.price)+' · Open'}</button></div>`}).join('')}</div><p class="mut" style="margin-top:14px">Every pack gives one icon. Repeats are possible — sell extras from your inventory. Icons work as tab icons and tag icons.</p>`;
  b.onclick=e=>{const bt=e.target.closest('[data-pk]');if(bt)openPackFlow(S.packs.find(x=>x.id===bt.dataset.pk))}},
t_inv(b){const kinds=[['all','All'],['name_color','Colors'],['icon','Icons'],['tag_preset','Tags']];
  b.innerHTML=`<div id="ifl"></div><div id="ig" class="grid" style="margin-top:14px"></div>`;
  const draw=()=>{const list=[...S.items.values()].filter(i=>owned(i.id)&&(this.filter==='all'||i.kind===this.filter)).sort((a,c)=>['common','uncommon','rare','epic','legendary'].indexOf(c.rarity)-['common','uncommon','rare','epic','legendary'].indexOf(a.rarity)||a.name.localeCompare(c.name));

  mkSeg($('#ifl',b),{options:kinds,value:this.filter,onChange:k=>{this.filter=k;draw()}});draw();
  b.onclick=e=>{const bt=e.target.closest('[data-do]');if(bt)this.act(bt)}},

  const side=(arr,coins)=>[...arr.map(x=>`${x.qty}× ${esc(itemById(x.item)?.name||x.item)}`),coins?`${num(coins)} coins`:''].filter(Boolean).join(', ')||'nothing';
  b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Trades</h3><button class="btn" id="nt">${ic('plus',16)} New trade</button></div><div class="card">${mine.length?mine.map(t=>{const inc=t.to_user===me();return `<div class="row" data-id="${t.id}"><div class="grow"><b>${inc?esc(nm(t.from_user))+' offers you':'You offered '+esc(nm(t.to_user))}</b><small>${inc?'You get':'They get'}: ${side(t.offer,t.offer_coins)}</small><small>${inc?'You give':'You get'}: ${side(t.want,t.want_coins)}</small></div><span class="pill">${t.status}</span>${t.status==='pending'?(inc?`<button class="btn sm" data-t="acc">Accept</button><button class="btn sm ghost" data-t="dec">Decline</button>`:`<button class="btn sm ghost" data-t="can">Cancel</button>`):''}</div>`}).join(''):'<p class="mut">No trades yet.</p>'}</div>`;
  $('#nt',b).onclick=()=>pickUser(id=>tradeModal(id));
  b.onclick=async e=>{const bt=e.target.closest('[data-t]');if(!bt)return;const id=bt.closest('[data-id]').dataset.id;const k=bt.dataset.t;
    const {error}=k==='can'?await rpc('cancel_trade',{p_id:id}):await rpc('respond_trade',{p_id:id,p_accept:k==='acc'});if(!error){toast(k==='acc'?'Trade complete':'Done','repeat');loadEco()}}}

async function openPackFlow(pk){
  if(!pk)return;if(!isOwner()&&myProfile().coins<pk.price)return toast('Not enough coins','coins');
  const m=Ui.modal(`<div class="packstage"><div class="packbox" style="--pc:${esc(pk.color)}">${ic('package',64)}</div><p class="mut">Opening ${esc(pk.name)}…</p></div>`,{cls:'pack',close:false});
  const [r]=await Promise.all([rpc('open_pack',{p_pack:pk.id}),sleep(1500)]);
  if(!r.data){m.close();return}
  const {item,qty}=r.data,isNew=r.data.new,R=RAR[item.rarity];S.inv[item.id]=qty;if(!isOwner())patchMe({coins:myProfile().coins-pk.price});renderChrome();

function shrink(file,w,h){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.max(w/im.width,h/im.height);const sw=w/sc,sh=h/sc;c.width=w;c.height=h;c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

economy(b){b.innerHTML=`<h2>Economy</h2><div class="card"><p class="mut" style="margin-top:0">Grant coins or items to a member. All grants are logged in the audit log.</p><button class="btn" id="gu">${ic('gift',16)} Choose a member…</button></div>`;$('#gu',b).onclick=()=>pickUser(id=>this.grantModal(id))},

const Chat={cur:null,
mount(v){this.v=v;this.render()},
viewing(){const t=curTab();return t?.route==='chat'&&!document.hidden},
keyOf:m=>m.dm_key?'d:'+m.dm_key:'c:'+m.channel_id,
dmKey:(a,b)=>[a,b].sort().join('_'),
find(id){return(S.msgs[this.cur]||[]).find(m=>m.id===id)},
async open(key){this.cur=key;S.unread[key]=0;S.pings[key]=0;renderChrome();await this.load(key);this.render()},
markRead(){if(this.cur){S.unread[this.cur]=0;S.pings[this.cur]=0;renderChrome();this.render()}},
async load(key){if(S.msgs[key])return;let q=S.sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100);q=key[0]==='c'?q.eq('channel_id',key.slice(2)):q.eq('dm_key',key.slice(2));const {data}=await q;S.msgs[key]=(data||[]).reverse()},
async edit(m){const t=await Ui.prompt('Edit message',{value:m.content,multi:true});if(t&&t.trim()){const {error}=await S.sb.from('messages').update({content:t.trim(),edited:true}).eq('id',m.id);if(error)toast(error.message)}},
async del(m){const {error}=await S.sb.from('messages').delete().eq('id',m.id);if(error)toast(error.message)},
render(){

  if(!S.user){v.innerHTML=`<div class="nt"><h1 style="font-size:46px">${ic('message-circle',44)} Chat</h1><p class="mut">Sign in to join channels and send DMs.</p><button class="btn" id="si">Sign in / Sign up</button></div>`;$('#si',v).onclick=()=>authModal();return}
  if(!this.cur&&S.channels[0]){this.cur='c:'+S.channels[0].id;this.load(this.cur).then(()=>this.render())}
  const keepScroll=$('.cmsgs',v),atBottom=!keepScroll||keepScroll.scrollHeight-keepScroll.scrollTop-keepScroll.clientHeight<80;

  const ch=!isDm?S.channels.find(c=>c.id===cur.slice(2)):null;const msgs=S.msgs[cur]||[];
  const dms=[...new Set([...S.dmKeys,...(isDm?[cur.slice(2)]:[])])];
  const mem=[...S.profiles.values()];const groups=[...new Set(mem.map(p=>topRole(p.id)?.id||'none'))];
  v.innerHTML=`<div class="chat"><div class="cside"><div style="padding:14px;font-weight:700;display:flex;gap:8px;align-items:center;font-family:var(--logo);font-size:18px">${hib(22)} Fiji Chat</div><div class="clist">

   <h4>Direct messages</h4>${dms.map(d=>{const o=d.split('_').find(x=>x!==me())||me();const p=S.profiles.get(o);const k='d:'+d;return `<button class="ci ${cur===k?'on':''} ${S.unread[k]?'un':''}" data-k="${k}" data-ctx="user" data-uid="${o}">${av(p,24)}<span>${esc(pname(p))}</span>${S.unread[k]?`<span class="badge">${S.unread[k]}</span>`:''}</button>`}).join('')||'<div style="padding:8px 10px;font-size:12px" class="mut">Click a member to start a DM</div>'}

  <div class="cmain"><div class="chead">${isDm?`${av(S.profiles.get(dmOther),26)} ${nameHtml(S.profiles.get(dmOther))}`:`${ic('hash',18)} ${esc(ch?.name||'')} <small>${esc(ch?.topic||'')}</small>`}</div>
   <div class="cmsgs">${this.msgsHtml(msgs)||'<div style="padding:30px;text-align:center" class="mut">No messages yet. Say hi 👋</div>'}</div>
   <div class="ccomp"><div id="sg"></div><textarea id="cin" rows="1" placeholder="${isDm?'Message @'+esc(S.profiles.get(dmOther)?.username||''):'Message #'+esc(ch?.name||'')} — @ to ping"></textarea></div></div>
  <div class="cmem">${groups.sort((a,b)=>(S.roles.find(r=>r.id===b)?.pos||0)-(S.roles.find(r=>r.id===a)?.pos||0)).map(g=>{const role=S.roles.find(r=>r.id===g);const ps=mem.filter(p=>(topRole(p.id)?.id||'none')===g).sort((a,b)=>(vstatus(a)==='offline')-(vstatus(b)==='offline'));
    return `<h4 style="color:${role?esc(role.color):'var(--mut)'}">${esc(role?.name||'Members')} — ${ps.length}</h4>${ps.map(p=>`<button class="ci" data-u="${p.id}" data-ctx="user" data-uid="${p.id}" style="${vstatus(p)==='offline'?'opacity:.5':''}">${av(p,28)}<span>${nameHtml(p)}</span>${tagHtml(p)}</button>`).join('')}`}).join('')}</div></div>`;
  $$('.ci[data-k]',v).forEach(b=>b.onclick=()=>this.open(b.dataset.k));$$('.ci[data-u]',v).forEach(b=>b.onclick=()=>showProfile(b.dataset.u));
  $('#cset',v).onclick=()=>openNative('settings');
  const ms=$('.cmsgs',v);if(atBottom)ms.scrollTop=ms.scrollHeight;else ms.scrollTop=keepScroll.scrollTop;
  $$('[data-del]',v).forEach(b=>b.onclick=()=>this.del({id:b.dataset.del}));$$('[data-edit]',v).forEach(b=>b.onclick=()=>this.edit(msgs.find(x=>x.id===b.dataset.edit)));
  $$('[data-pu]',v).forEach(b=>b.onclick=()=>showProfile(b.dataset.pu));
  const ta=$('#cin',v);ta.value=draft;if(focus||!draft)ta.focus();this.bindComposer(ta)},
msgsHtml(msgs){let last=null,lastT=0;
  return msgs.map(m=>{const p=S.profiles.get(m.author_id),r=topRole(m.author_id),t=new Date(m.created_at).getTime();
    const grouped=last===m.author_id&&t-lastT<300000;last=m.author_id;lastT=t;const ping=m.mention_everyone||(m.mentions||[]).includes(me());
    const acts=(m.author_id===me()?`<button data-edit="${m.id}" title="Edit">${ic('pencil',14)}</button>`:'')+((m.author_id===me()||perm('delete_messages'))?`<button data-del="${m.id}" title="Delete">${ic('trash-2',14)}</button>`:'');
    return `<div class="msg ${ping&&m.author_id!==me()?'me-ping':''}" data-ctx="msg" data-id="${m.id}" style="${grouped?'':'margin-top:10px'}">${grouped?'<div style="width:38px;flex:none"></div>':av(p,38,false)}<div class="mb">${grouped?'':`<div class="mh" data-ctx="user" data-uid="${m.author_id}"><span data-pu="${m.author_id}" style="cursor:pointer">${nameHtml(p)}</span>${tagHtml(p)}${r&&r.pos>1?`<span class="rtag" style="background:${esc(r.color)}">${esc(r.name)}</span>`:''}<small>${timeFmt(m.created_at)}</small></div>`}<div class="mt">${this.fmt(m)}${m.edited?' <small class="mut">(edited)</small>':''}</div></div><div class="ma">${acts}</div></div>`}).join('')},
fmt(m){let t=esc(m.content);
  t=t.replace(/```([\s\S]*?)```/g,'<pre style="background:#0d1114;color:#e6edf3;padding:8px;border-radius:8px;overflow:auto;margin:4px 0">$1</pre>').replace(/`([^`\n]+)`/g,'<code style="background:rgba(127,127,127,.22);padding:1px 5px;border-radius:5px">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="#" data-link="$1" style="color:var(--accent)">$1</a>');
  return t.replace(/@([\w.-]+)/g,(s,n)=>{const l=n.toLowerCase();if(l==='everyone'||l==='here')return `<span class="mention ${m.mention_everyone?'me':''}">@${l}</span>`;
    const p=[...S.profiles.values()].find(x=>x.username.toLowerCase()===l);if(p)return `<span class="mention ${p.id===me()?'me':''}">@${esc(p.username)}</span>`;
    const r=S.roles.find(x=>x.name.toLowerCase().replace(/\s+/g,'')===l);if(r)return `<span class="mention" style="color:${esc(r.color)}">@${esc(r.name)}</span>`;return s})},
async dm(uidv){if(uidv===me())return;const key=this.dmKey(me(),uidv);if(!S.dmKeys.includes(key))S.dmKeys.unshift(key);await this.open('d:'+key)},
bindComposer(ta){const sg=$('#sg',this.v);let idx=0,items=[];const close=()=>{sg.innerHTML='';items=[]};
  const upd=()=>{const pre=ta.value.slice(0,ta.selectionStart);const m=pre.match(/(?:^|\s)@([\w.-]*)$/);if(!m){close();return}const q=m[1].toLowerCase();items=[];
    [...S.profiles.values()].filter(p=>p.username.toLowerCase().startsWith(q)||pname(p).toLowerCase().startsWith(q)).slice(0,6).forEach(p=>items.push({ins:p.username,html:`${av(p,24,false)}<b>${nameHtml(p)}</b><small class="mut">@${esc(p.username)}</small>`}));
    S.roles.filter(r=>(r.mentionable||perm('ping_everyone'))&&r.name.toLowerCase().replace(/\s+/g,'').startsWith(q)).slice(0,4).forEach(r=>items.push({ins:r.name.replace(/\s+/g,''),html:`<span class="rtag" style="background:${esc(r.color)}">@${esc(r.name)}</span><small class="mut">role</small>`}));
    if(perm('ping_everyone'))['everyone','here'].filter(x=>x.startsWith(q)).forEach(x=>items.push({ins:x,html:`${ic('at-sign',18)}<b>@${x}</b><small class="mut">notify everyone</small>`}));idx=0;draw()};
  const draw=()=>{sg.innerHTML=items.length?`<div class="sugg">${items.map((it,i)=>`<button class="${i===idx?'on':''}" data-i="${i}">${it.html}</button>`).join('')}</div>`:'';$$('.sugg button',sg).forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(+b.dataset.i)})};
  const pick=i=>{const it=items[i];if(!it)return;const pos=ta.selectionStart;const pre=ta.value.slice(0,pos).replace(/@[\w.-]*$/,'@'+it.ins+' ');ta.value=pre+ta.value.slice(pos);ta.selectionStart=ta.selectionEnd=pre.length;close();ta.focus()};
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px';upd()});
  ta.addEventListener('keydown',e=>{if(items.length){if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%items.length;draw();return}if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+items.length)%items.length;draw();return}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(idx);return}if(e.key==='Escape'){close();return}}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.send(ta)}})},
async send(ta){const content=ta.value.trim();if(!content||!this.cur)return;if(S.ban)return toast('You are banned');
  const mentions=new Set();let everyone=false;
  (content.match(/@([\w.-]+)/g)||[]).forEach(tok=>{const n=tok.slice(1).toLowerCase();if(n==='everyone'||n==='here'){if(perm('ping_everyone'))everyone=true;return}
    const p=[...S.profiles.values()].find(x=>x.username.toLowerCase()===n);if(p){mentions.add(p.id);return}
    const r=S.roles.find(x=>x.name.toLowerCase().replace(/\s+/g,'')===n);if(r&&(r.mentionable||perm('ping_everyone')))S.userRoles.filter(u=>u.role_id===r.id).forEach(u=>mentions.add(u.user_id))});
  const row={author_id:me(),content,mentions:[...mentions],mention_everyone:everyone};
  if(this.cur[0]==='c')row.channel_id=this.cur.slice(2);else{row.dm_key=this.cur.slice(2);const o=row.dm_key.split('_').find(x=>x!==me());if(o)row.mentions=[...new Set([...row.mentions,o])]}
  ta.value='';ta.style.height='auto';const {error}=await S.sb.from('messages').insert(row);if(error){toast(error.message);ta.value=content}}
};
function onMsg(pl){
  const m=pl.new&&pl.new.id?pl.new:null,old=pl.old;
  if(pl.eventType==='INSERT'&&m){const key=Chat.keyOf(m);if(m.dm_key&&!S.dmKeys.includes(m.dm_key))S.dmKeys.unshift(m.dm_key);if(S.msgs[key]&&!S.msgs[key].some(x=>x.id===m.id))S.msgs[key].push(m);
    if(m.author_id!==me()){const viewing=Chat.viewing()&&Chat.cur===key&&document.hasFocus();
      if(!viewing){S.unread[key]=(S.unread[key]||0)+1;const ping=m.mention_everyone||(m.mentions||[]).includes(me()),dm=!!m.dm_key;if(ping&&!dm)S.pings[key]=(S.pings[key]||0)+1;
        if(myProfile()?.status!=='dnd'&&((dm&&S.settings.notifDm)||(ping&&S.settings.notifPing))){const a=S.profiles.get(m.author_id);const ch=S.channels.find(c=>c.id===m.channel_id);notify(dm?pname(a):`${pname(a)} pinged you${ch?' in #'+ch.name:''}`,m.content.slice(0,120),key,key)}}}}
  else if(pl.eventType==='UPDATE'&&m){const a=S.msgs[Chat.keyOf(m)];if(a){const i=a.findIndex(x=>x.id===m.id);if(i>=0)a[i]=m}}
  else if(pl.eventType==='DELETE'&&old){for(const k in S.msgs)S.msgs[k]=S.msgs[k].filter(x=>x.id!==old.id)}
  renderChrome();const t=curTab();if(t?.route==='chat')Chat.render();
}

/* ============ Sakuna AI + markdown ============ */
function md(src){
  const blocks=[];src=src.replace(/\r/g,'').replace(/```([\w+#.-]*)[ \t]*\n([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push(`<div class="cb"><div class="cbh"><span>${esc(l||'code')}</span><button data-copy>Copy</button></div><pre><code>${esc(c.replace(/\n$/,''))}</code></pre></div>`);return `\n@@B${blocks.length-1}@@\n`});
  const inline=s=>{s=esc(s);const codes=[];s=s.replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return `@@C${codes.length-1}@@`});
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*\*([^*\n]+)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/(^|[^_\w])_([^_\n]+)_(?![\w])/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s.replace(/@@C(\d+)@@/g,(m,i)=>`<code>${codes[i]}</code>`)};
  const li=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const run=lines=>{let out='',i=0;
    while(i<lines.length){const l=lines[i];if(!l.trim()){i++;continue}let m;
      if(m=l.match(/^@@B(\d+)@@$/)){out+=blocks[m[1]];i++;continue}
      if(m=l.match(/^(#{1,6})\s+(.*)$/)){out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;i++;continue}
      if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out+='<hr>';i++;continue}
      if(/^\s*>/.test(l)){const q=[];while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}out+=`<blockquote>${run(q)}</blockquote>`;continue}
      if(l.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){const head=cells(l);i+=2;const rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(cells(lines[i]));i++}
        out+=`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue}
      if(li.test(l)){const items=[];while(i<lines.length&&(li.test(lines[i])||(/^\s{2,}\S/.test(lines[i])&&items.length))){const mm=lines[i].match(li);if(mm){const t=mm[3].match(/^\[( |x|X)\]\s+(.*)$/);items.push({indent:mm[1].replace(/\t/g,'    ').length,ordered:/\d/.test(mm[2]),text:t?t[2]:mm[3],task:t?(t[1]===' '?'☐':'☑'):null})}else items[items.length-1].text+=' '+lines[i].trim();i++}
        let html='';const st=[];for(const it of items){while(st.length&&it.indent<st[st.length-1].indent)html+=`</li></${st.pop().tag}>`;if(!st.length||it.indent>st[st.length-1].indent){const tag=it.ordered?'ol':'ul';html+=`<${tag}>`;st.push({indent:it.indent,tag})}else html+='</li>';html+=`<li>${it.task?`<span class="tk">${it.task}</span>`:''}${inline(it.text)}`}
        while(st.length)html+=`</li></${st.pop().tag}>`;out+=html;continue}
      const para=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|@@B\d+@@|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])&&!/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])){para.push(lines[i]);i++}
      if(!para.length){para.push(lines[i]);i++}out+=`<p>${para.map(inline).join('<br>')}</p>`}
    return out};
  return run(src.split('\n'))}
const AI={hist:[],busy:false,open:false};
function buildAI(){
  const a=$('#ai');
  a.innerHTML=`<div class="aihead">${hib(34)}<div style="flex:1"><b style="font-family:var(--logo);font-size:17px">Sakuna</b><small>Your Fiji assistant · sees your page</small></div><button class="ib" id="aiClr" title="New chat">${ic('square-pen',17)}</button><button class="ib" id="aiX" title="Close">${ic('x',18)}</button></div>
  <div style="padding:10px 0 4px"><div class="aibar"><i id="aiBar"></i></div><div style="padding:4px 14px;font-size:11px" class="mut" id="aiCr"></div></div><div class="aimsgs" id="aiMsgs"></div>
  <div class="chips" id="aiChips"><span class="chip on" id="aiPg"></span><span class="chip" data-q="Summarize this page in a few bullet points.">Summarize</span><span class="chip" data-q="Explain this page like I'm new to the topic.">Explain simply</span><span class="chip" data-q="What are the key facts or takeaways here?">Key points</span></div>
  <div class="aicomp"><textarea id="aiIn" rows="1" placeholder="Ask Sakuna anything…"></textarea><button class="sendb" id="aiGo">${ic('send',17)}</button></div>`;
  $('#aiX').onclick=()=>toggleAI(false);$('#aiClr').onclick=()=>{AI.hist=[];aiGreet()};$('#aiGo').onclick=aiSubmit;
  $('#aiIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSubmit()}});
  $('#aiIn').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
  $$('#aiChips [data-q]').forEach(c=>c.onclick=()=>aiSend(c.dataset.q));$('#aiPg').onclick=()=>{S.settings.aiPage=!S.settings.aiPage;saveSettings();aiChip()};
  $('#aiMsgs').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard.writeText($('code',b.closest('.cb')).textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}});
  aiChip();aiGreet();aiCredits();
}
function aiChip(){const c=$('#aiPg');c.classList.toggle('on',!!S.settings.aiPage);c.innerHTML=ic('eye',13)+(S.settings.aiPage?' Page on':' Page off')}
function aiGreet(){$('#aiMsgs').innerHTML=`<div class="bub a md"><p>Hi, I'm <b>Sakuna</b> 🌺 I can read the page you're on — ask me to summarize it, explain it, or anything else. I can format answers with <b>markdown</b>, tables and code.</p></div>`}
function aiCredits(){const u=aiUsed(),l=aiLimit();$('#aiBar').style.width=Math.min(100,u/l*100)+'%';$('#aiCr').textContent=`${num(Math.max(0,l-u))} of ${num(l)} credits left · ${perm('premium_ai')?'Premium':'Free'}`}
function toggleAI(force){const a=$('#ai');AI.open=force??!AI.open;a.classList.toggle('open',AI.open);if(AI.open){if(!a.innerHTML)buildAI();aiCredits();setTimeout(()=>$('#aiIn')?.focus(),250)}}
function aiSubmit(){const i=$('#aiIn');const t=i.value.trim();if(!t)return;i.value='';i.style.height='auto';aiSend(t)}
async function pageContext(){
  const t=curTab();if(!t)return'';let text='';
  try{if(t.kind==='page'){const ctl=new AbortController();setTimeout(()=>ctl.abort(),9000);const r=await fetch(proxyBase()+encodeURIComponent(t.url),{signal:ctl.signal});const html=await r.text();const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,style,noscript,svg,iframe').forEach(e=>e.remove());text=(d.body?.textContent||'').replace(/\s+/g,' ').trim()}
    else if(t.kind==='internal'){text=(t.frame?.contentDocument?.body?.innerText||'').replace(/\s+/g,' ').trim()}else text=(t.el.innerText||'').replace(/\s+/g,' ').trim()}catch(e){text=''}
  return `Title: ${t.title}\nURL: ${t.url}\n`+(text?`Visible text (truncated):\n${text.slice(0,14000)}`:'(Page text could not be read — answer from the URL/title and say so if needed.)');
}
async function aiSend(text){
  if(AI.busy)return;if(!AI.open)toggleAI(true);if(S.ban)return;
  if(CONFIG.GROQ_API_KEY.startsWith('YOUR_'))return toast('Set GROQ_API_KEY in index.html');
  if(aiUsed()>=aiLimit()){toast('Out of Sakuna credits');return}
  AI.busy=true;const box=$('#aiMsgs');box.insertAdjacentHTML('beforeend',`<div class="bub u">${esc(text)}</div>`);
  const out=document.createElement('div');out.className='bub a md';out.innerHTML='<span class="spin"></span>';box.append(out);box.scrollTop=box.scrollHeight;
  AI.hist.push({role:'user',content:text});
  const ctx=S.settings.aiPage?await pageContext():'';
  const tone={concise:'Be very concise.',balanced:'Be clear and reasonably brief.',detailed:'Be thorough and detailed.'}[S.settings.aiTone];
  const sys=`You are Sakuna, the AI assistant built into Fiji, a Chrome-style web browser. ${tone} Format answers with GitHub-flavored markdown (headings, lists, tables, bold, fenced code blocks with a language). You can see the user's current page when provided below; never invent page content that isn't there.`+(ctx?`\n\n--- CURRENT PAGE ---\n${ctx}`:'');
  const msgs=[{role:'system',content:sys},...AI.hist.slice(-12)];let raw='',usage=null;
  try{const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CONFIG.GROQ_API_KEY},body:JSON.stringify({model:CONFIG.GROQ_MODEL,messages:msgs,stream:true,temperature:S.settings.aiTemp,max_tokens:2048,stream_options:{include_usage:true}})});
    if(!res.ok)throw new Error((await res.text()).slice(0,200));
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d);if(j.usage)usage=j.usage;else if(j.x_groq?.usage)usage=j.x_groq.usage;const c=j.choices?.[0]?.delta?.content;if(c){raw+=c;const clean=raw.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').trimStart();out.innerHTML=clean?md(clean):'<span class="mut">thinking…</span>';box.scrollTop=box.scrollHeight}}catch{}}}
  }catch(e){out.innerHTML=`<span style="color:#ff6b6b">Sakuna hit an error: ${esc(e.message)}</span>`}
  const final=raw.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').trim();
  if(final){AI.hist.push({role:'assistant',content:final});out.innerHTML=md(final)}
  const tokens=usage?.total_tokens??Math.ceil((sys.length+AI.hist.slice(-12).reduce((a,m)=>a+m.content.length,0)+raw.length)/4);
  await addCredits(tokens);AI.busy=false;aiCredits();
}
async function addCredits(n){if(S.user){const next=(myProfile().ai_used||0)+n;patchMe({ai_used:next});await S.sb.from('profiles').update({ai_used:next}).eq('id',me())}else lsSet('fiji.aiused',aiUsed()+n)}

/* ============ boot ============ */
(async function boot(){
  applyTheme();Dev.init();renderChrome();initSW();newTab(S.settings.home);
  try{await initSB()}catch(e){console.error(e);toast('Supabase failed: '+e.message)}
  renderChrome();
})();
</script>
